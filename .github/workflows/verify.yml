name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component rustfmt,clippy
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

      # The chain must verify against the committed registry, and `data/` must
      # match the digests inside the signed payload. A tree where those have
      # drifted apart is exactly what this artifact exists to make impossible.
      - name: verify the committed chain
        if: hashFiles('doe.aion') != ''
        run: |
          cargo build --release --locked
          ./target/release/doe-aion verify
